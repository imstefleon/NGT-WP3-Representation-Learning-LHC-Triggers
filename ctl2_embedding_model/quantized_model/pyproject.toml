[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngt-quantized-model"
version = "0.1.0"
description = "Reproducible CPU INT8 conversion and validation of NGT MHA checkpoints"
requires-python = ">=3.10,<3.13"
dependencies = ["torch==2.5.1", "numpy>=1.24,<3", "scikit-learn>=1.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]
