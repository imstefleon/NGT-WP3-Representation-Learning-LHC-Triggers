workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"

image: gitlab-registry.cern.ch/ml_l1/ctl2_embedding_model:Prod

stages:
  - load
  - preprocess
  - train
  - validate
  - compile

.before_ml:
  before_script:
    - source activate training-gpu
    - export KRB5CCNAME=FILE:/tmp/krb5cc_shared
    - echo "${EOSPASS}" | kinit "${EOSUSER}@CERN.CH"
    - klist
    - cd ${MODEL_NAME}

load_data:
  extends: .before_ml
  stage: load
  tags: [cern-nextgen-highmem]
  script:
    - kedro run --pipeline=load_data --params run_name=${RUN_NAME}_load_data
  artifacts:
    paths:
      - ${MODEL_NAME}/data/02_loaded/${MODEL_NAME}_data.parquet
      - ${MODEL_NAME}/data/02_loaded/${MODEL_NAME}_meta_data.json

preprocess_data:
  extends: .before_ml
  stage: preprocess
  needs: [load_data]
  tags: [cern-nextgen-highmem]
  script:
    - kedro run --pipeline=data_processing --params run_name=${RUN_NAME}_process_data
  artifacts:
    paths:
      - ${MODEL_NAME}/data/03_preprocessed/

train_model:
  extends: .before_ml
  stage: train
  needs: [preprocess_data]
  tags: [cern-nextgen-h100-47GB]
  script:
    - kedro run --pipeline=model_training --params run_name=${RUN_NAME}_train_model
  artifacts:
    paths:
      - ${MODEL_NAME}/data/04_models/

validate_model:
  extends: .before_ml
  stage: validate
  needs: [preprocess_data, train_model]
  tags: [cern-nextgen-h100-47GB]
  script:
    - kedro run --pipeline=model_validation --params run_name=${RUN_NAME}_validate_model
  artifacts:
    paths:
      - ${MODEL_NAME}/data/05_validation/

compile:
  extends: .before_ml
  stage: compile
  needs: [preprocess_data, train_model, validate_model]
  tags: [cern-nextgen-highmem]
  script:
    - export LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$LD_LIBRARY_PATH
    - kedro run --pipeline=compile --params run_name=${RUN_NAME}_compile_model
  artifacts:
    when: always
    paths:
      - ${MODEL_NAME}/data/06_compile/

