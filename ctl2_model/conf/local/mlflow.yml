server:
  mlflow_tracking_uri: https://ml.cern.ch/models
  mlflow_registry_uri: null
  credentials: mlflow_auth
  request_header_provider:
    type: null
    pass_context: false
    init_kwargs: {}

tracking:
  disable_tracking:
    disable_autologging: true
    pipelines: []
  experiment:
    name: maglowac-ctl2-embedding
    create_experiment_kwargs:
      artifact_location: null
      tags: null
    restore_if_deleted: true
  run:
    id: null
    name: "${runtime_params:run_name,null}"
    nested: true
  params:
    dict_params:
      flatten: false
      recursive: true
      sep: "."
    long_params_strategy: fail

ui:
  port: "5000"
  host: "127.0.0.1"
