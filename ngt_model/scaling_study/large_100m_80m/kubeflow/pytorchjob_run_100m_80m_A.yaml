apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: ngt-100m-80m-a
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: registry.cern.ch/REPLACE/ctl2-embedding-model:REPLACE
              command: ["/bin/bash", "-lc"]
              args:
                - cd /workspace/ctl2_embedding_model && bash ngt_model/scaling_study/large_100m_80m/commands/launch_torchrun_100m_80m.sh A
              resources:
                limits:
                  nvidia.com/gpu: 4
                  memory: "1300Gi"
                requests:
                  nvidia.com/gpu: 4
                  memory: "1000Gi"
              volumeMounts:
                - name: eos
                  mountPath: /eos
          volumes:
            - name: eos
              persistentVolumeClaim:
                claimName: REPLACE_EOS_PVC
    Worker:
      replicas: 0
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: registry.cern.ch/REPLACE/ctl2-embedding-model:REPLACE
