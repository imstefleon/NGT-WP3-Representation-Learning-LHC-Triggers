[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngt-model"
version = "0.1.0"
description = "NGT PyTorch MHA event representations for Collide-2V L1 inputs"
requires-python = ">=3.10,<3.13"
dependencies = ["torch==2.5.1", "numpy>=1.24,<3"]

[project.optional-dependencies]
training = ["pandas>=2,<4", "scikit-learn>=1.3,<2", "pyarrow>=14", "matplotlib>=3.7", "mlflow>=2", "huggingface-hub>=0.20", "uproot>=5", "awkward>=2"]

[tool.setuptools.packages.find]
where = ["src"]
